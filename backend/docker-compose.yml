version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kisansetu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kisansetu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisansetu_api
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kisansetu_db
      POSTGRES_PORT: 5432
      SECRET_KEY: kisansetu-super-secret-production-jwt-key-2026
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
